name: test-basic
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout via x-cmd-action/checkout (default path = workspace)
        uses: x-cmd-action/checkout@main

      - name: verify clone landed in workspace
        run: |
          echo "=== top-level ==="
          ls
          echo "=== action.yml head ==="
          head -3 action.yml
          echo "=== checkout.sh head ==="
          head -3 lib/checkout.sh
          echo "=== git identity ==="
          git config user.name
          git config user.email

      - name: checkout into custom path
        uses: x-cmd-action/checkout@main
        with:
          path: ./custom-path

      - name: verify custom path worked
        run: |
          echo "=== custom-path ==="
          ls custom-path
          test -f custom-path/action.yml && echo "OK: action.yml present in custom-path"

      - name: checkout with gitconfig file
        uses: x-cmd-action/checkout@main
        with:
          path: ./gc
          gitconfig: ./.github/workflows/test.gitconfig

      - name: verify gitconfig include was applied (repo-scoped)
        run: |
          cd gc
          # Confirm the [include] entry is in .git/config
          grep -q "include" .git/config && echo "OK: include directive in .git/config"
          # Confirm the included values are visible via git config in the repo
          test "$(git config user.name)" = "test-checkout-bot" && echo "OK: user.name from file applied (repo-scoped)"
          test "$(git config user.email)" = "test-checkout-bot@example.com" && echo "OK: user.email from file applied (repo-scoped)"
          # Confirm global ~/.gitconfig was NOT touched
          cd "$HOME" 2>/dev/null || cd /
          test "$(git config --global user.name 2>/dev/null || echo)" != "test-checkout-bot" && echo "OK: global ~/.gitconfig untouched"