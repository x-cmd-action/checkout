name: test-basic
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout via x-cmd-action/checkout
        uses: x-cmd-action/checkout@main
        with:
          path: ./cloned

      - name: debug — what is in cwd
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-unset}"
          echo "--- top-level ---"
          ls -la
          echo "--- cloned (if exists) ---"
          ls -la cloned 2>&1 || echo "cloned DOES NOT EXIST"
          echo "--- debug log from action step ---"
          cat "${RUNNER_TEMP:-/tmp}/checkout-debug.log" 2>&1 || echo "debug log not found"