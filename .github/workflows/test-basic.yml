name: test-basic
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout via x-cmd-action/checkout
        uses: x-cmd-action/checkout@main
        with:
          path: ./cloned

      - name: debug — what is in cwd
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-unset}"
          echo "--- top-level ---"
          ls -la
          echo "--- cloned (if exists) ---"
          ls -la cloned 2>&1 || echo "cloned DOES NOT EXIST"
          echo "--- env INPUT_* ---"
          env | grep -E '^INPUT_' || echo "no INPUT_* env vars"
          echo "--- searching for cloned anywhere ---"
          find / -name 'action.yml' -path '*x-cmd-action*' 2>/dev/null | head -5