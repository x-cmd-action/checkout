name: benchmark-vs-actions-checkout
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: prepare benchmark dir
        run: mkdir -p /tmp/bench

      # ── actions/checkout@v4 × 3 ──
      - name: mark ac1 start
        run: date +%s%N > /tmp/bench/ac1_start

      - name: actions/checkout@v4 (run 1)
        uses: actions/checkout@v4

      - name: mark ac1 end
        run: date +%s%N > /tmp/bench/ac1_end

      - name: mark ac2 start
        run: date +%s%N > /tmp/bench/ac2_start

      - name: actions/checkout@v4 (run 2)
        uses: actions/checkout@v4

      - name: mark ac2 end
        run: date +%s%N > /tmp/bench/ac2_end

      - name: mark ac3 start
        run: date +%s%N > /tmp/bench/ac3_start

      - name: actions/checkout@v4 (run 3)
        uses: actions/checkout@v4

      - name: mark ac3 end
        run: date +%s%N > /tmp/bench/ac3_end

      # ── x-cmd-action/checkout@v1 × 3 ──
      - name: mark xc1 start
        run: date +%s%N > /tmp/bench/xc1_start

      - name: x-cmd-action/checkout@v1 (run 1)
        uses: x-cmd-action/checkout@v1

      - name: mark xc1 end
        run: date +%s%N > /tmp/bench/xc1_end

      - name: mark xc2 start
        run: date +%s%N > /tmp/bench/xc2_start

      - name: x-cmd-action/checkout@v1 (run 2)
        uses: x-cmd-action/checkout@v1

      - name: mark xc2 end
        run: date +%s%N > /tmp/bench/xc2_end

      - name: mark xc3 start
        run: date +%s%N > /tmp/bench/xc3_start

      - name: x-cmd-action/checkout@v1 (run 3)
        uses: x-cmd-action/checkout@v1

      - name: mark xc3 end
        run: date +%s%N > /tmp/bench/xc3_end

      # ── compute and report ──
      - name: summary
        if: always()
        run: |
          ns_to_ms() { awk "BEGIN {printf \"%.0f\", (\$2 - \$1) / 1000000}"; }

          AC1_MS=$(ns_to_ms $(cat /tmp/bench/ac1_start) $(cat /tmp/bench/ac1_end))
          AC2_MS=$(ns_to_ms $(cat /tmp/bench/ac2_start) $(cat /tmp/bench/ac2_end))
          AC3_MS=$(ns_to_ms $(cat /tmp/bench/ac3_start) $(cat /tmp/bench/ac3_end))
          XC1_MS=$(ns_to_ms $(cat /tmp/bench/xc1_start) $(cat /tmp/bench/xc1_end))
          XC2_MS=$(ns_to_ms $(cat /tmp/bench/xc2_start) $(cat /tmp/bench/xc2_end))
          XC3_MS=$(ns_to_ms $(cat /tmp/bench/xc3_start) $(cat /tmp/bench/xc3_end))

          # Warm best = min(warm runs); cold = 1st
          AC_WARM_MS=$(awk "BEGIN {v = $AC2_MS; if ($AC3_MS < v) v = $AC3_MS; print v}")
          XC_WARM_MS=$(awk "BEGIN {v = $XC2_MS; if ($XC3_MS < v) v = $XC3_MS; print v}")

          echo ""
          echo "=== Step duration (ms) ==="
          echo ""
          printf "%-35s %12s %12s %12s\n" "" "cold (1st)" "warm (2nd)" "warm (3rd)"
          printf "%-35s %12s %12s %12s\n" "actions/checkout@v4" "$AC1_MS" "$AC2_MS" "$AC3_MS"
          printf "%-35s %12s %12s %12s\n" "x-cmd-action/checkout@v1" "$XC1_MS" "$XC2_MS" "$XC3_MS"
          echo ""

          echo "Best warm run (excludes cold tarball download):"
          printf "  actions/checkout@v4:        %s ms\n" "$AC_WARM_MS"
          printf "  x-cmd-action/checkout@v1:   %s ms\n" "$XC_WARM_MS"
          if [ "$XC_WARM_MS" -gt 0 ]; then
            RATIO=$(awk "BEGIN {printf \"%.2f\", $AC_WARM_MS / $XC_WARM_MS}")
            echo "  Ratio: actions/checkout took ${RATIO}x longer"
          fi

          echo ""
          echo "Notes:"
          echo "  - 'cold' = first call in this job; tarball is downloaded from scratch."
          echo "  - 'warm' = subsequent calls; tarball already cached."
          echo "  - All steps clone the same x-cmd-action/checkout repo (depth=1)."
          echo "  - Real CI on a typical job hits 1 cold + 0-N warm; ratio depends on"
          echo "    job size but warm ratio is the more representative number."