name: Checkout (Shell)
description: |
  Pure-shell drop-in for actions/checkout — same inputs, same behavior, no Node.js.
  Adds three x-cmd conveniences: known-hosts-url, fetch-additional, gitconfig.

inputs:
  repository:
    description: 'Repository to check out: <owner>/<repo>'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'Branch, tag, or SHA to check out'
    required: false
    default: ${{ github.ref_name }}
  token:
    description: 'Token for HTTPS clone of private repos'
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: 'SSH private key (alternative to token; takes priority when set)'
    required: false
  ssh-known-hosts:
    description: |
      Custom known_hosts content (verbatim). Prepended to the merged known_hosts
      written for the SSH connection.
    required: false
  known-hosts-url:
    description: |
      URL to a known_hosts file (curl-fetched at runtime). Useful when you manage
      host keys centrally (e.g., a raw GitHub gist or repo). x-cmd enhancement —
      actions/checkout does not have this input.
    required: false
  ssh-strict:
    description: 'Whether to enforce strict host key checking'
    required: false
    default: 'true'
  ssh-user:
    description: 'SSH user for git@ connections (default: git)'
    required: false
    default: 'git'
  path:
    description: 'Where to clone'
    required: false
    default: ${{ github.workspace }}
  clean:
    description: 'Whether to wipe the path before cloning'
    required: false
    default: 'true'
  fetch-depth:
    description: 'Number of commits to fetch. 0 = full history.'
    required: false
    default: '1'
  fetch-tags:
    description: 'Whether to fetch tags'
    required: false
    default: 'false'
  fetch-additional:
    description: |
      Additional refs to fetch in the same operation (space-separated).
      x-cmd enhancement — actions/checkout does not have this input.
    required: false
  lfs:
    description: 'Whether to pull LFS files'
    required: false
    default: 'false'
  submodules:
    description: 'Submodule recursion: false | true | recursive'
    required: false
    default: 'false'
  sparse-checkout:
    description: 'Patterns for sparse checkout (one per line)'
    required: false
  sparse-checkout-cone-mode:
    description: 'Use cone mode for sparse checkout'
    required: false
    default: 'true'
  filter:
    description: 'Partial clone filter (e.g., blob:none, tree:0). Overrides sparse-checkout.'
    required: false
  persist-credentials:
    description: 'Keep credentials configured for subsequent git commands'
    required: false
    default: 'true'
  show-progress:
    description: 'Show fetch / checkout progress'
    required: false
    default: 'true'
  set-safe-directory:
    description: 'Auto-add safe.directory globally (needed for container runners)'
    required: false
    default: 'true'
  github-server-url:
    description: 'GitHub server URL (override for Enterprise Server)'
    required: false
    default: ${{ github.server_url }}
  allow-unsafe-pr-checkout:
    description: |
      Required to check out fork PR code from pull_request_target / workflow_run
      workflows. See actions/checkout docs for the security context.
    required: false
    default: 'false'
  local-config:
    description: |
      Path to a .gitconfig file. When set, added as [include] in the checked-out
      repo's .git/config — repo-scoped only, the runner's ~/.gitconfig is left
      alone. Use this for repo-specific signing keys, custom identity, etc.
      x-cmd enhancement — actions/checkout does not have this input.
    required: false

runs:
  using: composite
  steps:
    - name: git checkout (shell)
      shell: bash
      env:
        # Composite actions don't auto-expose inputs as INPUT_* env vars to inner
        # shell steps — we map them explicitly. Mirrors the convention
        # actions/checkout uses internally.
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SSH_KEY: ${{ inputs.ssh-key }}
        INPUT_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        INPUT_KNOWN_HOSTS_URL: ${{ inputs.known-hosts-url }}
        INPUT_SSH_STRICT: ${{ inputs.ssh-strict }}
        INPUT_SSH_USER: ${{ inputs.ssh-user }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CLEAN: ${{ inputs.clean }}
        INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
        INPUT_FETCH_TAGS: ${{ inputs.fetch-tags }}
        INPUT_FETCH_ADDITIONAL: ${{ inputs.fetch-additional }}
        INPUT_LFS: ${{ inputs.lfs }}
        INPUT_SUBMODULES: ${{ inputs.submodules }}
        INPUT_SPARSE_CHECKOUT: ${{ inputs.sparse-checkout }}
        INPUT_SPARSE_CHECKOUT_CONE_MODE: ${{ inputs.sparse-checkout-cone-mode }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_PERSIST_CREDENTIALS: ${{ inputs.persist-credentials }}
        INPUT_SHOW_PROGRESS: ${{ inputs.show-progress }}
        INPUT_SET_SAFE_DIRECTORY: ${{ inputs.set-safe-directory }}
        INPUT_GITHUB_SERVER_URL: ${{ inputs.github-server-url }}
        INPUT_ALLOW_UNSAFE_PR_CHECKOUT: ${{ inputs.allow-unsafe-pr-checkout }}
        INPUT_LOCAL_CONFIG: ${{ inputs.local-config }}
      run: bash ${{ github.action_path }}/lib/checkout.sh
